name: lslim-dev

services:
  app:
    image: lslim-dev-app:local
    pull_policy: never
    init: true
    volumes:
      - .:/workspaces/lslim
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: lslim
      DB_USERNAME: lslim
      DB_PASSWORD: lslim
      DB_TEST_DATABASE: lslim_test
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAILER_DSN: smtp://mailpit:1025
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  mysql:
    # Change this tag to select a different MySQL version.
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: lslim-root
      MYSQL_DATABASE: lslim
      MYSQL_USER: lslim
      MYSQL_PASSWORD: lslim
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./.devcontainer/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -D lslim_test -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1

volumes:
  mysql-data:
